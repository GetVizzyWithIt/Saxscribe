<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Play along · Saxscribe</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="top">
  <div class="row">
    <a class="button" href="/">‹ Library</a>
    <span class="runpill" id="runPill" title="Every flag you make here is saved against this run">Flags go to: <span id="runName">…</span></span>
    <span class="spacer"></span>
    <div class="seg" id="audioSel" hidden>
      <button type="button" data-v="source" class="on">Record</button><button type="button" data-v="stem">Sax only</button><button type="button" data-v="accompaniment">Band only</button>
    </div>
    <details class="menu" id="dl">
      <summary class="button">Download</summary>
      <div class="list">
        <button id="pdf">PDF sheet music</button>
        <button id="xml">MusicXML (for MuseScore)</button>
        <button id="midi">MIDI (played timing)</button>
      </div>
    </details>
  </div>
</header>
<main id="score"><div class="loading">Loading the score…</div></main>
<div id="ask" hidden></div>
<footer class="transport">
  <details id="tracker">
    <summary><span id="trackSum">Feedback</span><span class="chev" aria-hidden="true">▴</span></summary>
    <div class="trackbody">
      <div id="flagItems"></div>
      <div class="trackact"><span class="quiet small">Saved as you go to this song’s flags.json, with a copy in Desktop/Saxscribe. Tap a row to go there.</span><button type="button" id="copyFlags">Copy for Claude</button><button type="button" id="dlFlags">Download flags.json</button></div>
    </div>
  </details>
  <div class="reviewbar"><div id="strip" aria-label="Bars: heard, flagged, to sort"></div><span id="stripNote"></span></div>
  <div class="row">
    <button class="primary play" id="play" aria-label="Play">▶</button>
    <span class="time" id="time">0:00 / 0:00</span>
    <input type="range" id="seek" min="0" max="1" step="0.01" value="0" aria-label="Position">
    <select id="speed" aria-label="Speed">
      <option value="0.5">50%</option><option value="0.6">60%</option><option value="0.7">70%</option>
      <option value="0.75">75%</option><option value="0.8">80%</option><option value="0.9">90%</option>
      <option value="1" selected>100%</option>
    </select>
    <div class="seg zoom"><button type="button" id="smaller" aria-label="Smaller notes">A−</button><button type="button" id="bigger" aria-label="Bigger notes">A+</button></div>
    <button type="button" id="follow" class="on" aria-pressed="true">Follow</button>
    <button type="button" id="sortBtn" hidden>Sort flags</button>
    <button type="button" id="flag"><b>⚑ Flag</b><small>tap = bar · hold = stretch</small></button>
  </div>
</footer>
<section class="sheet" id="sheet" hidden aria-label="Flag these bars">
  <div id="grab" title="Drag to resize. Double-click to shrink." aria-label="Resize"></div>
  <div class="sheet-in">
    <div class="head">
      <div class="ctl"><button type="button" id="sRestart" aria-label="Back to the start of the flag">⏮</button><button type="button" id="sBack" aria-label="Back 2 seconds">⏪ 2s</button><button type="button" id="sPlay" aria-label="Play">▶</button></div>
      <h2 id="sheetTitle">Bar</h2><span class="quiet small" id="sheetTime"></span>
      <button type="button" id="loopBtn">⟲ Loop</button>
    </div>
    <div id="range">
      <span>From bar <span class="stepper"><button type="button" data-r="from:-1" aria-label="Start one bar earlier">−</button><input type="number" id="fromBar" inputmode="numeric" min="1" value="1" aria-label="First bar"><button type="button" data-r="from:1" aria-label="Start one bar later">+</button></span></span>
      <span>to bar <span class="stepper"><button type="button" data-r="to:-1" aria-label="End one bar earlier">−</button><input type="number" id="toBar" inputmode="numeric" min="1" value="1" aria-label="Last bar"><button type="button" data-r="to:1" aria-label="End one bar later">+</button></span></span>
    </div>
    <div id="groups"></div>
    <div id="detail" class="field"><span class="quiet small">More detail (optional)</span><div class="chips" id="cats"></div></div>
    <div class="field">
      <div class="seg" id="scope"><button type="button" data-v="bar" class="on">Whole bar</button><button type="button" data-v="notes">Just these notes</button></div>
      <span class="quiet small" id="pickHint" hidden>Tap notes in the bars to pick them.</span>
    </div>
    <textarea id="flagText" rows="2" placeholder="Say it in your own words (optional). On iPad, the mic key on the keyboard dictates."></textarea>
    <div class="actions">
      <button type="button" class="primary" id="saveFlag">Save</button>
      <button type="button" id="cancelFlag">Close</button>
      <button type="button" id="deleteFlag" class="danger" hidden>Delete flag</button>
    </div>
  </div>
</section>
<textarea id="clip" aria-hidden="true" tabindex="-1" readonly></textarea>
<audio id="audio" preload="auto"></audio>
<div class="toast" id="toast"></div>
<script src="/static/common.js"></script>
<script src="/static/play.js"></script>
</body>
</html>
